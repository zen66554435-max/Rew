<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
</head>
<body style="font-family: Tahoma; background: #ecf0f1; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="background: white; padding: 40px; border-radius: 10px; width: 350px;">
        <h2>تسجيل الدخول</h2>
        {% if error %}
        <p style="color: red;">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="اسم المستخدم" style="width: 100%; padding: 10px; margin: 10px 0;"><br>
            <input type="password" name="password" placeholder="كلمة المرور" style="width: 100%; padding: 10px; margin: 10px 0;"><br>
            <button style="width: 100%; padding: 10px; background: #3498db; color: white; border: none;">دخول</button>
        </form>
        <a href="/forgot-password" style="display: block; margin-top: 15px;">نسيت كلمة المرور؟</a>
    </div>
</body>
</html>
