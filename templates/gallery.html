<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>{{ gallery.caption }}</title>
</head>
<body style="font-family: Tahoma; background: #f5f5f5; padding: 20px;">
    <h1>{{ gallery.caption }}</h1>
    <img src="/{{ gallery.image_path }}" style="max-width: 600px; border-radius: 8px;">
    <p>رفع بواسطة: {{ gallery.username }}</p>
    
    <h2>التعليقات</h2>
    {% for comment in comments %}
    <div style="background: white; padding: 10px; margin: 10px 0; border-radius: 5px;">
        <strong>{{ comment.username }}</strong>: {{ comment.comment }}
    </div>
    {% endfor %}
    
    <form method="POST" action="/comment/{{ gallery.id }}">
        <textarea name="comment" placeholder="أضف تعليقاً" style="width: 100%; padding: 10px;"></textarea>
        <button>إرسال</button>
    </form>
</body>
</html>
