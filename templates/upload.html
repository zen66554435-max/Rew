<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>رفع صورة</title>
</head>
<body style="font-family: Tahoma; background: #ecf0f1; padding: 20px;">
    <h1>رفع صورة جديدة</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*"><br><br>
        <input type="text" name="caption" placeholder="وصف الصورة" style="width: 100%; padding: 10px;"><br><br>
        <button style="padding: 10px 20px; background: #27ae60; color: white; border: none;">رفع</button>
    </form>
</body>
</html>
