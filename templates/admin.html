<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>لوحة الإدارة</title>
</head>
<body style="font-family: Tahoma; background: #2c3e50; color: white; padding: 20px;">
    <h1>لوحة الإدارة</h1>
    <p>عدد الصور: {{ galleries_count }}</p>
    <h2>المستخدمين</h2>
    <table border="1" style="width: 100%; border-collapse: collapse;">
        <tr>
            <th>ID</th>
            <th>اسم المستخدم</th>
            <th>البريد</th>
            <th>الدور</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/admin/export" style="color: #3498db;">تصدير البيانات CSV</a>
</body>
</html>
