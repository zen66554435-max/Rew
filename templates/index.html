<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>معرض الصور - الصفحة الرئيسية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .nav { background: #2c3e50; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .nav a { color: white; margin: 0 10px; text-decoration: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-content { padding: 15px; }
        .card h3 { margin: 0 0 10px; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/">الرئيسية</a>
        <a href="/upload">رفع صورة</a>
        <a href="/profile">الملف الشخصي</a>
        {% if session.get('user_id') %}
            <a href="/logout">تسجيل خروج</a>
            <span style="color: #ecf0f1;">مرحباً {{ session.get('username') }}</span>
        {% else %}
            <a href="/login">تسجيل دخول</a>
        {% endif %}
    </nav>
    <h1>معرض الصور</h1>
    <div class="grid">
        {% for gallery in galleries %}
        <div class="card">
            <img src="/{{ gallery.image_path }}" alt="{{ gallery.caption }}">
            <div class="card-content">
                <h3>{{ gallery.caption }}</h3>
                <p>بواسطة: {{ gallery.username }}</p>
                <a href="/gallery/{{ gallery.id }}">عرض التفاصيل</a>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
